<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recipe Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Cinzel:wght@500;700&family=Playfair+Display:wght@500;700&family=Libre+Baskerville:wght@400;700&display=swap">
<style>
/* Layout: Rolodex-style rolling card wheel beside a designed recipe card; settings edit the card like the Rolodex card designer. */
:root{
  --ground:#F7F7F5; --card:#FFFFFF; --ink:#111111; --ink-2:#6B6B63; --line:#E4E4E0; --rule:#EEEEEA;
  --accent:#3F4A3C; --on-accent:#FFFFFF; --shadow:rgba(17,17,17,.28);
  --font-serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark) and (min-width:99999px){
  :root:not([data-theme="light"]){--ground:#141513;--card:#1D1F1B;--ink:#F2F2EE;--ink-2:#A3A39A;--line:#2F312C;--rule:#262823;--accent:#B9C7B2;--on-accent:#141513;--shadow:rgba(0,0,0,.6);color-scheme:dark}
}
:root[data-theme="dark"]{--ground:#141513;--card:#1D1F1B;--ink:#F2F2EE;--ink-2:#A3A39A;--line:#2F312C;--rule:#262823;--accent:#B9C7B2;--on-accent:#141513;--shadow:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.app{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--font-serif);font-weight:500;margin:0;text-wrap:balance;letter-spacing:.005em}
body{font-synthesis:none;font-feature-settings:'kern','liga';-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:lining-nums}
.ir b,.nm{font-variant-numeric:tabular-nums lining-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:30px;line-height:1.1}
.top .sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-top:2px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:3px;background:var(--card);gap:2px}
.seg button{border:0;background:transparent;min-height:40px;padding:0 14px;border-radius:11px;cursor:pointer;font-size:13px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.btn{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 18px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--ink-2)}
.btn.quiet{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 200px;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:0 18px;color:var(--ink)}
.hint{font-size:12.5px;color:var(--ink-2);margin:4px 0 0}
.empty{padding:48px 16px;text-align:center;color:var(--ink-2)}

.wheel-wrap{position:relative;height:clamp(480px,calc(100dvh - 210px),780px);overflow:hidden;border:1px solid var(--line);border-radius:28px;background:var(--ground)}
.wheel-wrap::before,.wheel-wrap::after{content:"";position:absolute;left:0;right:0;height:70px;z-index:3;pointer-events:none}
.wheel-wrap::before{top:0;background:linear-gradient(var(--ground),transparent)}
.wheel-wrap::after{bottom:0;background:linear-gradient(transparent,var(--ground))}
.wheel{position:relative;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;perspective:900px;perspective-origin:50% 50%;padding-inline:16px 40px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wcard{min-height:116px;margin-bottom:10px;scroll-snap-align:center;scroll-snap-stop:always;cursor:pointer;outline-offset:2px}
.wi{height:100%;will-change:transform,opacity;transform-origin:50% 50%}
.slot{position:absolute;left:10px;right:34px;top:50%;height:124px;margin-top:-62px;border:1px solid var(--accent);border-radius:22px;opacity:.28;pointer-events:none;z-index:2}
.az{position:absolute;right:6px;top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column}
.az button{font:600 10px var(--font-body);color:var(--ink-2);background:none;border:0;width:28px;height:19px;cursor:pointer;border-radius:6px;padding:0}
.az button[aria-current="true"]{color:var(--on-accent);background:var(--accent)}
.desk{display:grid;gap:28px}
.menubar{display:flex;align-items:center;gap:14px;margin:0 0 22px;padding:0 0 14px;border-bottom:1px solid var(--line)}.menubar .search{flex:0 1 260px;min-width:160px}.menubar .tagstrip{flex:1;min-width:0;margin:0;border:0;justify-content:flex-start}.menubar .nvtog{flex:0 0 auto;background:transparent;border:0;box-shadow:none}
@media (min-width:1000px){.desk{grid-template-columns:400px minmax(0,1fr);align-items:start}.dpane{position:sticky;top:16px}}

.rcard{position:relative;border-radius:18px;overflow:hidden;isolation:isolate;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rc-bg,.rc-paper{position:absolute;inset:0}
.rc-bg{z-index:-2}.rc-paper{z-index:-1}
.rc-body{position:relative}
.mini .rc-body{height:100%;padding:14px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.mini .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.mini .row>*{min-width:0}
.mini .tt{white-space:normal;text-align:center;line-height:1.15;overflow-wrap:anywhere;padding:2px 0}.mini .rc-body{height:auto;min-height:116px;justify-content:center;gap:6px}.mini .row{justify-content:space-between}.mini .row:last-child{justify-content:center}.mini.rcard,.rcard.mini{overflow:visible}
.full .rc-body{padding:40px clamp(26px,5vw,56px) 44px}
.cc{background:rgba(255,255,255,.88);color:#111;border:1px solid rgba(0,0,0,.14);border-radius:12px;font:500 14px var(--font-body);cursor:pointer}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .cc{width:44px;height:44px;font-size:22px;line-height:1}
.stepper output{min-width:34px;text-align:center;font:500 22px var(--font-body);color:#111;background:rgba(255,255,255,.7);border-radius:10px;padding:2px 6px}
.ctl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin:16px 0 4px}
.ctl .lab{display:flex;align-items:center;gap:10px}

.full .secthd{margin:34px 0 14px;display:flex;align-items:center;gap:14px}.full .secthd>div{font-size:13px!important;letter-spacing:.2em;text-transform:uppercase;font-weight:500;opacity:.85;white-space:nowrap}.full .secthd:after{content:'';flex:1;height:1px;background:currentColor;opacity:.18}
.full .ings{display:flex;flex-direction:column;gap:2px}.full .ings .ir{border-top:0;padding:9px 0;gap:6px 18px;grid-template-columns:minmax(84px,auto) minmax(0,1fr) auto}
.full .ctl{margin:22px 0 4px}.full .turnrow{border-top:0;margin-top:34px;padding-top:0}
.full .stepsl{gap:18px!important}
.ir{display:grid;grid-template-columns:minmax(78px,auto) minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid rgba(17,17,17,.14)}
.nbars{display:flex;flex-direction:column;gap:9px;width:100%}.nbar{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr) auto;gap:6px 18px;align-items:center;font-size:12.5px;color:var(--ink-2)}.nbar i{display:block;height:3px;border-radius:3px;background:rgba(120,110,90,.22);position:relative;overflow:hidden}.nbar i:after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);background:var(--sage,#3F4A3C);border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}.nbv{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.nvline{margin-top:8px}.nvl{font-size:13px;letter-spacing:.02em;color:var(--ink-2);animation:fadeup .4s both}.nvs{opacity:.7;font-size:12px}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.stat>div{display:flex;flex-direction:column;gap:2px}
.star{border:0;background:none;cursor:pointer;line-height:1;padding:8px 2px;min-width:26px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}.star:hover{transform:scale(1.15)}
.heart{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%}
.back{margin-bottom:12px}

.set{display:grid;gap:24px}
@media (min-width:900px){.set{grid-template-columns:minmax(0,1fr) 440px;align-items:start}.set .pv{order:2;position:sticky;top:16px}}
@media (max-width:899px){.pv{position:sticky;top:0;z-index:5;background:var(--ground);padding:6px 0 10px}}
.sec{border-top:1px solid var(--line);padding-top:22px;margin-top:26px}
.sec:first-child{border-top:0;margin-top:0;padding-top:0}
.sec h2{font-size:22px}
.field{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.field>label,.lab2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.field select{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;color:var(--ink);width:100%}
.szrow{display:flex;align-items:center;gap:12px}
.szrow input[type=range]{flex:1;min-width:0;accent-color:var(--accent);min-height:32px}
.szrow output{min-width:48px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.sw-row{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.sw{width:40px;height:40px;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%}
.sw i{display:block;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.sw-row input[type=color]{width:40px;height:40px;border:0;background:none;padding:0;cursor:pointer}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lib{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.lib .it{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--card)}
.lib .th,.lib .fs{width:56px;height:56px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 1px rgba(128,128,128,.3)}
.lib .th{background-size:cover;background-position:center}
.lib .fs{display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--ground)}
.lib input[type=text]{flex:1 1 120px;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--ground);color:var(--ink)}
.lib select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--ground);padding:0 8px;color:var(--ink)}
.file{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:999px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.addv textarea,.stepsbox textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical;min-height:120px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.how{border:1px solid var(--line);border-radius:14px;padding:6px 14px;background:var(--card)}
.how summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.how ol{margin:0 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.how code{background:var(--ground);padding:1px 6px;border-radius:6px;font-size:12.5px;word-break:break-all}
.clist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.crow{display:flex;gap:12px;align-items:center;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--card);cursor:pointer}
.crow input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.draftbox{max-width:860px}
.fieldrow{display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;gap:10px}
@media (max-width:640px){.fieldrow{grid-template-columns:1fr 1fr}.fieldrow label:first-child{grid-column:1/-1}}
.fieldrow label,.stepsbox{display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.fieldrow input,.fieldrow select{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;color:var(--ink);font-size:15px;letter-spacing:0;text-transform:none;width:100%}
.rrows{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.rrow{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.rrow .orig{font-weight:600;overflow-wrap:anywhere}
.rctl{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:8px}
@media (max-width:640px){.rctl{grid-template-columns:1fr}}
.rrow select,.rrow input[type=search],.rrow input[type=number]{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--ground);padding:0 10px;color:var(--ink);width:100%;min-width:0}
.rctl2{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rctl2 label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.rctl2 input[type=number]{width:96px}
.rctl2 .chk input{width:20px;height:20px;accent-color:var(--accent)}
.rstat{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.warn{font-size:13px;color:#9C2A3A}
@media (prefers-color-scheme:dark) and (min-width:99999px){:root:not([data-theme="light"]) .warn{color:#F0A0A8}}
:root[data-theme="dark"] .warn{color:#F0A0A8}
.sumbox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.sumbox .big{font:500 22px var(--font-serif)}
.stage{position:relative;padding:22px;border-radius:26px;overflow:hidden;border:1px solid var(--line)}
.stage.tight{padding:12px}
.flipw{perspective:1600px}
.flipi{transform-origin:50% 50%;cursor:pointer}
.turnrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;border-top:1px solid rgba(17,17,17,.14);padding-top:14px}
.cc.turn{min-height:44px;padding:0 18px;border-radius:999px}
.wheel-wrap::before,.wheel-wrap::after{display:none}
@media (prefers-reduced-motion:reduce){.flipi{transition:none!important}}
.tools .primary,.btns .primary{white-space:nowrap}
.wgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));margin-top:6px}
.dcol{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:6px;min-width:0}
.dcol.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dcol h3{font:600 15px var(--font-body)}.dcol h3 span{font-weight:400;color:var(--ink-2)}
.slotl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
.ent{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--rule);padding-top:6px}
.entname{background:none;border:0;text-align:left;cursor:pointer;font-weight:600;padding:6px 0;min-height:44px;font-size:14px;line-height:1.25;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.entctl{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.mini-b{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--ground);cursor:pointer;font-size:18px}
.srv{font-size:13px;color:var(--ink-2);min-width:60px;text-align:center}
.addb{width:100%;margin-top:4px}
.addf{display:flex;flex-direction:column;gap:8px}
.addf select,.addf input{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--ground);padding:0 10px;color:var(--ink);width:100%;min-width:0}
.addf label{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px}.addf label input{width:90px}
.tbars{display:flex;flex-direction:column;gap:8px;margin-top:8px;border-top:1px solid var(--rule);padding-top:10px}
.tl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}.tv{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.track{height:8px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:4px}.track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tbar.under .track i{background:var(--ink-2)}.tbar.over .track i{background:#B5543B}
.ts{font-size:11px;color:var(--ink-2);margin-top:2px}.tbar.over .ts{color:#B5543B;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:99px;background:var(--card);padding:2px 4px 2px 14px;font-size:13px}
.chip button{width:36px;height:36px;border:0;background:none;cursor:pointer;font-size:18px;color:var(--ink-2)}
.csec{margin-top:22px}
.crow2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:6px 0;min-height:52px}
.crow2.done .cn{text-decoration:line-through;color:var(--ink-2)}.crow2.have .cn{color:var(--ink-2)}
.cchk{display:flex;align-items:flex-start;gap:12px;flex:1 1 220px;cursor:pointer;padding:6px 0}
.cchk input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.ca{color:var(--ink-2);font-variant-numeric:tabular-nums}
.shelf{margin:0 0 34px}
.shelfrow{display:flex;gap:22px;align-items:flex-end;padding:0 18px 14px;min-height:230px}
.plank{height:18px;border-radius:4px;background:linear-gradient(#B79266,#9A7547);box-shadow:0 8px 14px -6px rgba(0,0,0,.35);margin-top:-2px}
.book{flex:1 1 0;max-width:190px;min-width:0;background:none;border:0;padding:0;cursor:pointer;transform:rotate(var(--tilt,0deg));transform-origin:50% 100%;transition:transform .2s;display:flex;flex-direction:column;align-items:stretch;gap:6px;color:var(--ink)}
.book:hover,.book:focus-visible{transform:translateY(-8px) rotate(0)}
.cover{position:relative;aspect-ratio:3/4;border-radius:4px 10px 10px 4px;box-shadow:inset 7px 0 0 rgba(0,0,0,.22),inset 9px 0 0 rgba(255,255,255,.08),3px 4px 10px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;padding:14px 12px 14px 20px;overflow:hidden}
.cover .plate{width:100%;padding:12px 8px;border-radius:6px}
.bcount{font-size:12px;color:var(--ink-2);text-align:center}
.book.newb{aspect-ratio:3/4;max-height:250px;margin-bottom:26px;border:2px dashed var(--line);border-radius:8px;justify-content:center;align-items:center;font-size:34px;color:var(--ink-2)}
.book.newb em{font:normal 13px var(--font-body)}
.bookopen{position:relative;perspective:1800px;max-width:980px}
.pages{padding:6px 4px 10px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.bcard{background:none;border:0;padding:0;cursor:pointer;text-align:left;border-radius:18px}
.bcard:hover{transform:translateY(-3px)}
.flap{position:absolute;inset:0;transform-origin:left center;animation:swing 1s .15s cubic-bezier(.5,0,.2,1) forwards;z-index:3;pointer-events:none;backface-visibility:hidden}
.flap .cover.big{height:100%;aspect-ratio:auto;border-radius:6px 14px 14px 6px;padding:40px}
@keyframes swing{0%{transform:rotateY(0);opacity:1}85%{opacity:1}100%{transform:rotateY(-172deg);opacity:0;visibility:hidden}}
